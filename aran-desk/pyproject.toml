[project]
name = "aran-desk"
version = "0.1.0"
description = "Aran Desk: read-only stalkerware scanner and evidence sealer"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.159.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
